<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Lab</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d2321;--mute:#6b706b;--line:#ddd7ca;--acc:#1f6f5c;--acc2:#e3f0eb;--bad:#b4442f;--bad2:#f6e3de;--warn:#b7841f}
*{box-sizing:border-box}body{margin:0;font-family:Satoshi,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:900;letter-spacing:-.01em}header h1 span{color:var(--acc)}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;width:100%}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:500}
nav button.on{background:var(--acc2);color:var(--acc);font-weight:700}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--acc)}.btn:disabled{opacity:.4;cursor:default}
main{max-width:1100px;margin:0 auto;padding:24px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.kpi b{display:block;font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}.kpi small{color:var(--mute)}
h2{font-size:22px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:12px 14px;border-radius:10px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt.ok{background:var(--acc2);border-color:var(--acc)}.opt.no{background:var(--bad2);border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:10px;margin-top:12px}.fb.ok{background:var(--acc2)}.fb.no{background:var(--bad2)}
.score{position:sticky;top:12px}.muted{color:var(--mute);font-size:14px}
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;cursor:pointer;perspective:800px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.qa{display:grid;grid-template-columns:2fr 1fr;gap:16px}@media(max-width:760px){.qa{grid-template-columns:1fr}.score{position:static}}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:700}
label{font-size:14px;font-weight:500;display:block;margin:10px 0 4px}
.chart{display:flex;gap:4px;align-items:flex-end;height:80px}.chart i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}
.btn.sm{padding:5px 10px;font-size:13px}.secs td{vertical-align:middle}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px}
.chk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;cursor:pointer;background:#fff}.chk input{width:auto}.chk span:nth-child(2){flex:1}
.seg button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}.seg button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}
.opt.sel{background:var(--acc2);border-color:var(--acc);font-weight:500}
.rev{border-top:1px solid var(--line);padding:12px 0}.no-t{color:var(--bad);font-size:14px}.ok-t{color:var(--acc);font-size:14px;font-weight:700}

.preview-banner{background:#e3f0eb;color:#1f6f5c;text-align:center;padding:8px;font-size:12px;font-weight:700;letter-spacing:.04em}.definitions{margin-top:20px}.definitions h3{margin:4px 0}.definition-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:800}.definition-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:16px 0}.definition-item{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card)}.definition-item strong{font-size:15px}.definition-item p{font-size:14px;line-height:1.55;color:var(--mute);margin:6px 0 0}.definition-reference{background:var(--acc2);border:1px solid #c5ddd3;border-radius:12px;padding:16px;margin-top:18px}.definition-reference .definition-item{margin:10px 0}.flash-reference{max-width:640px;margin:0 auto}#definitionSearch{max-width:460px}
.dashboard-lookup{margin-top:16px}.dashboard-lookup h3{margin:4px 0}.lookup-result{border:1px solid var(--line);border-radius:10px;min-height:80px;padding:14px;background:#f7faf7;color:var(--mute)}.lookup-result .definition-item{border:0;padding:4px;background:transparent}.definitions h2{margin:4px 0}header{position:sticky;top:0;z-index:10}
.definition-quiz-shortcut{padding:16px;border:1px solid #c5ddd3;border-radius:12px;background:var(--acc2);margin-bottom:22px}.definition-quiz-shortcut h3{margin:4px 0}.definition-quiz-shortcut p{margin:6px 0 14px}
.definition-flash{width:100%;margin:16px 0;padding:32px;min-height:300px;background:var(--card);color:var(--ink)}.definition-flash h2{font-size:30px;margin:18px 0}.definition-meaning{font-size:19px;line-height:1.6;margin:0 0 22px}
.flash-example{text-align:left;background:var(--acc2);border-left:3px solid var(--acc);border-radius:8px;padding:14px 16px;margin:0 0 20px}.flash-example p{font-size:16px;line-height:1.55;margin:6px 0 0}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}.scenario-card h3{margin:14px 0 8px}.scenario-card p{font-size:15px;line-height:1.6}.scenario-card details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}.scenario-card summary{color:var(--acc);cursor:pointer;font-size:14px;font-weight:700}#scenarioSearch{max-width:500px}
.acronym-full-name{font-size:14px;font-weight:700;color:var(--acc);margin:7px 0 10px}

.profile-header{display:flex;align-items:center;gap:10px;width:100%;border-top:1px solid var(--line);padding-top:10px}.profile-header small{font-size:12px;color:var(--mute)}.profile-dashboard{margin-bottom:20px;border-color:#b8d7cb}.profile-dashboard h3{margin:5px 0}.profile-dashboard p{margin:5px 0}.resume-panel{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--acc2);border-radius:10px;padding:16px;margin-top:14px}.profile-note{font-size:12px;line-height:1.5;color:var(--mute);margin-top:14px}.save-warning{font-size:14px;color:var(--bad);padding:10px;border:1px solid var(--bad);border-radius:8px}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 16px 80px #0003}dialog::backdrop{background:#14251c77;backdrop-filter:blur(3px)}dialog hr{border:0;border-top:1px solid var(--line);margin:12px 0}
</style></head><body>
<header><button class="btn ghost sm" onclick="screenBack()" aria-label="Go back">← Back</button><h1>Learning<span>Lab</span></h1>
<div style="width:360px;max-width:100%"><select id="deckSel" aria-label="Topic"></select></div>
<nav id="nav"><button data-v="dash">Dashboard</button><button data-v="definitions">Definitions</button><button data-v="scenarios">Real-World Scenarios</button><button data-v="quiz">Quiz</button><button data-v="flash">Flashcards</button><button data-v="build">Build topic</button></nav><div class="profile-header"><button id="profileButton" class="btn ghost sm" onclick="profileDialog()">Choose profile</button><small id="profileStatus">Autosave on</small></div></header>
<main id="app"></main>
<script src="scrp-bank.js"></script>
<script src="app.js"></script></body></html>
